<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아미고시 — 출시 준비 중</title>
<meta name="description" content="코드 진행과 곡 구성만 정하면 리듬 섹션이 밴드처럼 맞춰 연주하는 연습 앱, 아미고시. 지금 출시를 준비하고 있습니다.">
<meta property="og:title" content="아미고시 · Amigosi">
<meta property="og:description" content="코드만 정하면 밴드가 따라옵니다. 출시 준비 중입니다.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#101214">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='24 22 60 64'%3E%3Crect x='24' y='22' width='60' height='64' rx='14' fill='%231A1D21'/%3E%3Cpath fill='%23E0952E' d='M39,34 C33.5,48 35.5,66 43,78.5 Q54,82.5 65,78.5 C72.5,66 74.5,48 69,34 Z'/%3E%3Cpath fill='%232A2D33' d='M37.6,35.5 Q54,45 70.4,35.5 L69.8,40 Q54,49.5 38.2,40 Z'/%3E%3Cpath fill='%23F6F1E8' d='M38,33 a16,6 0 1,0 32,0 a16,6 0 1,0 -32,0 Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 출시 전 대체 페이지(2026-11-17). 소개 페이지 전체는 index-full.html 에 있다.
   출시하면 index-full.html 을 index.html 로 되돌린다(이 파일은 지운다). 색과 글꼴은 index-full.html 과 같다. */
:root{
  --ground:#101214; --surface:#1A1D21; --raised:#23272D; --line:#2E333A;
  --ink:#F2F0EA; --quiet:#A4A9B0; --accent:#F5A524; --now:#4FD1C5;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --num:'Space Grotesk','Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
h1,p{margin:0}
a{color:inherit}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-inline:20px}
button{font-family:inherit;color:var(--ink);cursor:pointer}
:focus-visible{outline:2px solid var(--now);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand svg{width:34px;height:36px;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;min-width:48px;min-height:36px;font-size:13px;font-family:var(--num);font-weight:700;color:var(--quiet)}
.lang button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}

main{flex:1;display:flex;align-items:center;position:relative;padding-block:40px 72px}
main::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 380px at 15% 35%,rgba(245,165,36,.16),transparent 70%),
             radial-gradient(520px 420px at 85% 65%,rgba(79,209,197,.10),transparent 70%)}
.kicker{font-family:var(--num);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.14;font-weight:700;letter-spacing:-.02em;margin-top:14px;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lead{margin-top:20px;font-size:18px;color:#C9CDD3;max-width:34em}
.badge{display:inline-flex;align-items:center;gap:10px;min-height:52px;margin-top:32px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--now)}
.note{margin-top:14px;font-size:14px;color:var(--quiet);max-width:34em}

footer{border-top:1px solid var(--raised);padding-block:28px 40px;font-size:13px;color:var(--quiet)}
footer p + p{margin-top:8px}
footer a{color:#C9CDD3}
@media (max-width:620px){.lead{font-size:16.5px}}
</style>
</head>
<body>

<header class="wrap top">
  <span class="brand">
    <svg viewBox="30 24 48 60" aria-hidden="true">
      <path fill="#E0952E" d="M39,34 C33.5,48 35.5,66 43,78.5 Q54,82.5 65,78.5 C72.5,66 74.5,48 69,34 Z"/>
      <path fill="#B8721C" d="M57,36 C62,36 66,35.5 69,34 C74.5,48 72.5,66 65,78.5 Q61,80 57,80.6 C60,66 60.5,50 57,36 Z"/>
      <path fill="#2A2D33" d="M38.6,60 Q54,66 69.4,60 L68.9,63 Q54,69 39.1,63 Z"/>
      <path fill="#2A2D33" d="M37.6,35.5 Q54,45 70.4,35.5 L69.8,40 Q54,49.5 38.2,40 Z"/>
      <path fill="#C9CED6" d="M43.2,41.5 l2.2,0.9 l-0.6,7 l-2.2,-0.9 Z M52.9,44 l2.2,0 l0,7 l-2.2,0 Z M62.6,42.4 l2.2,-0.9 l0.6,7 l-2.2,0.9 Z"/>
      <path fill="#F6F1E8" d="M38,33 a16,6 0 1,0 32,0 a16,6 0 1,0 -32,0 Z"/>
    </svg>
    <span data-i18n="brand">아미고시</span>
  </span>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="kicker">Son Montuno · Latin rhythm section</p>
    <h1 data-i18n="h1">코드만 정하면,<br><em>밴드가 따라옵니다.</em></h1>
    <p class="lead" data-i18n="lead">코드 진행과 곡 구성만 정하면 클라베, 콩가, 봉고, 베이스, 피아노가 한 밴드처럼 맞춰 연주하는 연습 앱입니다.</p>
    <p class="badge"><i></i><span data-i18n="badge">출시 준비 중입니다</span></p>
    <p class="note" data-i18n="note">스토어에 올라가면 이 페이지에서 알려 드립니다.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <p><b data-i18n="brand">아미고시</b> · Amigosi</p>
    <p data-i18n="ft.links"><a href="privacy.html?lang=ko">개인정보처리방침</a></p>
  </div>
</footer>

<script>
(function(){
'use strict';
/* 한국어는 HTML에, 영어는 여기에. 언어 고르기는 index-full.html 과 같다(?lang= 이 있으면 그것을 먼저 따른다) */
var EN={
 'brand':'Amigosi',
 'h1':'Set the chords.<br><em>The band follows.</em>',
 'lead':'A practice app where clave, congas, bongos, bass and piano play your chord progression and song form together, like a real band.',
 'badge':'Coming soon',
 'note':'We will announce it on this page when it reaches the stores.',
 'ft.links':'<a href="privacy.html?lang=en">Privacy policy</a>'
};
var TITLE={ko:'아미고시 — 출시 준비 중',en:'Amigosi — Coming soon'};
var KO={};
var els=document.querySelectorAll('[data-i18n]');
Array.prototype.forEach.call(els,function(el){var k=el.getAttribute('data-i18n');if(!(k in KO))KO[k]=el.innerHTML;});
function setLang(l){
  document.documentElement.lang=l;document.title=TITLE[l];
  Array.prototype.forEach.call(els,function(el){var k=el.getAttribute('data-i18n');el.innerHTML=(l==='en'&&EN[k])||KO[k];});
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===l?'true':'false');});
  try{localStorage.setItem('lrb-lang',l);}catch(e){}
}
Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-lang'));});});
var q=(location.search.match(/[?&]lang=(ko|en)\b/)||[])[1];
var saved=null;try{saved=localStorage.getItem('lrb-lang');}catch(e){}
setLang(q||saved||((navigator.language||'ko').toLowerCase().indexOf('ko')===0?'ko':'en'));
})();
</script>
</body>
</html>
